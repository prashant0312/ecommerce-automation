name: Selenium Maven Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify DemoBlaze secrets are configured
        env:
            DEMOBLAZE_USERNAME: ${{ secrets.DEMOBLAZE_USERNAME }}
            DEMOBLAZE_PASSWORD: ${{ secrets.DEMOBLAZE_PASSWORD }}
        run: |
            test -n "$DEMOBLAZE_USERNAME" && echo "Username secret is populated" || (echo "Username secret is missing or empty" && exit 1)
            test -n "$DEMOBLAZE_PASSWORD" && echo "Password secret is populated" || (echo "Password secret is missing or empty" && exit 1)
      - name: Run Selenium Maven Tests
        env:
          CI: 'true'
          DEMOBLAZE_USERNAME: ${{ secrets.DEMOBLAZE_USERNAME }}
          DEMOBLAZE_PASSWORD: ${{ secrets.DEMOBLAZE_PASSWORD }}
        run: mvn --batch-mode clean test
      - name: Upload test reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-results
          path: |
            target/
            test-output/
            screenshots/
          if-no-files-found: warn
          retention-days: 14